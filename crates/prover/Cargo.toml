[package]
name = "zkm-prover"
description = "Ziren prover"
readme = "../../README.md"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[dependencies]
p3-air = { workspace = true }
p3-uni-stark = { workspace = true }
p3-matrix = { workspace = true }
zkm-recursion-compiler = { workspace = true }
zkm-recursion-core = { workspace = true }
zkm-recursion-circuit = { workspace = true }
zkm-recursion-gnark-ffi = { workspace = true }
zkm-core-machine = { workspace = true }
zkm-pcs = { workspace = true }
p3-symmetric = { workspace = true }
zkm-core-executor = { workspace = true }
zkm-primitives = { workspace = true }
p3-field = { workspace = true }
p3-challenger = { workspace = true }
p3-koala-bear = { workspace = true }
p3-bn254-fr = { workspace = true }
p3-commit = { workspace = true }
p3-util = { workspace = true }
bincode = "1.3.3"
serde = { workspace = true, features = ["derive", "rc"] }
itertools = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4.5.9", features = ["derive", "env"] }
anyhow = "1.0.83"
dirs = "5.0.1"
num-bigint = "0.4.6"
thiserror = "1.0.63"
rayon = "1.10.0"
lru = "0.12.4"
eyre = "0.6.12"

[dev-dependencies]
test-artifacts = { workspace = true }
serial_test = "3.1.1"

[[bin]]
name = "build_plonk_bn254"
path = "scripts/build_plonk_bn254.rs"

[[bin]]
name = "build_groth16_bn254"
path = "scripts/build_groth16_bn254.rs"

[[bin]]
name = "build_compress_vks"
path = "scripts/build_compress_vks.rs"

[[bin]]
name = "soundcalc_census"
path = "scripts/soundcalc_census.rs"

[[bin]]
name = "proof_size_census"
path = "scripts/proof_size_census.rs"

[[bin]]
name = "collect_basefold_vks"
path = "scripts/collect_basefold_vks.rs"

[[bin]]
name = "list_shapes"
path = "scripts/list_shapes.rs"

[[bin]]
name = "merge_vk_maps"
path = "scripts/merge_vk_maps.rs"

[[bin]]
name = "regen_basefold_vks_for_tests"
path = "scripts/regen_basefold_vks_for_tests.rs"

[[bin]]
name = "time_prover_new"
path = "scripts/time_prover_new.rs"

[[bin]]
name = "write_basefold_vk_map"
path = "scripts/write_basefold_vk_map.rs"

[[bin]]
name = "post_trusted_setup"
path = "scripts/post_trusted_setup.rs"

[[bin]]
name = "check_vk_coverage"
path = "scripts/check_vk_coverage.rs"

[[bin]]
name = "enum_build_coverage"
path = "scripts/enum_build_coverage.rs"

[[bin]]
name = "find_maximal_shapes"
path = "scripts/find_maximal_shapes.rs"

[[bin]]
name = "find_small_shapes"
path = "scripts/find_small_shapes.rs"

[[bin]]
name = "find_oom_shapes"
path = "scripts/find_oom_shapes.rs"

[[bin]]
name = "find_recursion_shapes"
path = "scripts/find_recursion_shapes.rs"

[[bin]]
name = "test_shape_fixing"
path = "scripts/test_shape_fixing.rs"

[[bin]]
name = "tendermint_perf"
path = "scripts/tendermint_perf.rs"

[[bin]]
name = "sha2_perf"
path = "scripts/sha2_perf.rs"

[features]
default = ["native-gnark"]
native-gnark = ["zkm-recursion-gnark-ffi/native"]
debug = ["zkm-core-machine/debug"]
# The Groth16 verification key (vk) is not affected by the Ziren upgrade.
imm-wrap-vk = ["zkm-recursion-core/imm-wrap-vk"]
